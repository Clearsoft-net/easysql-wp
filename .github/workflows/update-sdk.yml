name: Update SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New SDK version (semver, e.g. 0.2.0)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -P '^\d+\.\d+\.\d+$' > /dev/null; then
            echo "error: version must be semver (e.g. 0.2.0)"
            exit 1
          fi

      - name: Update easysql/sdk version in composer.json
        run: |
          sed -i \
            '/"easysql\/sdk"/s/"\([^"]*\)"/"${{ github.event.inputs.version }}"/' \
            composer.json

      - name: Validate JSON
        run: php -r 'json_decode(file_get_contents("composer.json")); echo json_last_error_msg();'

      - name: Run composer install
        run: composer install --no-interaction

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): bump easysql/sdk to ${{ github.event.inputs.version }}"
          title: "chore(deps): bump easysql/sdk to ${{ github.event.inputs.version }}"
          body: |
            Bumps [easysql/sdk](https://github.com/Clearsoft-net/easysql-sdk-php) to `${{ github.event.inputs.version }}`.

            **Auto-generated by the [Update SDK](.github/workflows/update-sdk.yml) workflow.**
          branch: deps/sdk-${{ github.event.inputs.version }}
          base: main
