name: Update SDK

on:
  repository_dispatch:
    types: [spec_updated, sdk_released]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Update EasySQL PHP SDK packages
        run: composer update clearsoft/easysql-client clearsoft/easysql-common clearsoft/easysql-connectors clearsoft/easysql-schema-generation --with-all-dependencies --no-interaction --no-progress

      - name: Read new SDK version from lock file
        id: sdk_version
        run: |
          VERSION=$(composer show clearsoft/easysql-client --format=json | php -r "echo json_decode(stream_get_contents(STDIN))->versions[0];")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --exit-code composer.json composer.lock > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): bump easysql SDK to ${{ steps.sdk_version.outputs.version }}"
          title: "chore(deps): bump easysql SDK to ${{ steps.sdk_version.outputs.version }}"
          body: |
            Bumps the EasySQL PHP SDK packages to `${{ steps.sdk_version.outputs.version }}`.

            **Auto-generated by the [Update SDK](.github/workflows/update-sdk.yml) workflow.**

            Triggered by: `${{ github.event_name }}`
          branch: deps/sdk-${{ steps.sdk_version.outputs.version }}
          base: main
          delete-branch: true
